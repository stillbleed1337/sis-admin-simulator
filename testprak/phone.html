<div id="phone-wrapper">
    <div id="phone-left-panel">
        <div id="phone-left-header">Контакты</div>
        <div id="phone-contacts">
            <div class="contact-item" id="btn-general">
                <img src="assets/images/spravochnik.png" class="contact-avatar">
                <div class="contact-info">
                    <div class="contact-name">Общий чат</div>
                    <div class="contact-status" id="status-general">Оффлайн</div>
                </div>
            </div>
            <div class="contact-item" id="btn-magistr">
                <img src="assets/images/magistr.png" class="contact-avatar">
                <div class="contact-info">
                    <div class="contact-name">Магистр</div>
                    <div class="contact-status" id="status-magistr">Оффлайн</div>
                </div>
            </div>
            <div class="contact-item" id="btn-jora">
                <img src="assets/images/jora.png" class="contact-avatar">
                <div class="contact-info">
                    <div class="contact-name">Жорик</div>
                    <div class="contact-status" id="status-jora">Оффлайн</div>
                </div>
            </div>
            <div class="contact-item" id="btn-acc">
                <img src="assets/images/buhgalter.png" class="contact-avatar">
                <div class="contact-info">
                    <div class="contact-name">Гл. Бухгалтер</div>
                    <div class="contact-status" id="status-acc">Оффлайн</div>
                </div>
            </div>
            <div class="contact-item" id="btn-dir">
                <img src="assets/images/director.png" class="contact-avatar">
                <div class="contact-info">
                    <div class="contact-name">Директор</div>
                    <div class="contact-status" id="status-dir">Оффлайн</div>
                </div>
            </div>
        </div>
    </div>
    <div id="phone-right-panel">
        <div id="phone-chat-header">
            <div id="chat-name">Выберите чат</div>
            <div id="btn-close-phone">✖</div>
        </div>
        <div id="chat-body">
            <!-- Сообщения будут генерироваться сюда через game.js -->
        </div>
        <div id="phone-footer">
            <div class="chat-btn" id="btn-hint" style="display: none;">💡 Взять подсказку</div>
            <div class="chat-btn" id="btn-next" style="display: none;">Продолжить ➔</div>
        </div>
    </div>
</div>
